context:
  version: "0.2.0"

package:
  name: fsspec-rs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fsspec_rs/fsspec_rs-${{ version }}.tar.gz
  sha256: 8613b46b122fdcbb3bc48ba8d75827800f99404037e065fa881680cb0cdc32e3

build:
  number: 0
  python:
    version_independent: true
  script:
    - if: unix
      then: export PYO3_PYTHON="$PYTHON"
      else: set "PYO3_PYTHON=%PYTHON%"
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: is_abi3 and not is_python_min

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
        - crossenv
        - hatchling
        - hatch-rs >=0.4.3
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - hatchling
    - hatch-rs >=0.4.3
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python
    - fsspec

tests:
  - python:
      imports:
        - fsspec_rs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

  - if: is_abi3
    then:
      script:
        - if: win
          then: abi3audit %SP_DIR%\fsspec_rs\fsspec_rs.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit $SP_DIR/fsspec_rs/fsspec_rs.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      requirements:
        run:
          - abi3audit

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: fsspec-compatible backends with Rust accleration
  homepage: https://github.com/1kbgz/fsspec-rs
  repository: https://github.com/1kbgz/fsspec-rs

extra:
  recipe-maintainers:
    - timkpaine
